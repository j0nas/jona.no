<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/img/win/my-computer.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The Windows Standard scheme is the only scheme: keep UA form controls light
         and tell Dark Reader to leave the desktop alone. -->
    <meta name="color-scheme" content="light" />
    <meta name="darkreader-lock" />
    <title>Jonas Jensen</title>
    <meta
      name="description"
      content="Jonas Jensen, a software developer in Oslo. A personal site styled as a Windows 95 desktop."
    />
    <!-- Touchup, the review layer: about 1.5 kB that does nothing for a visitor, and only loads the
         comment widget in a browser that opened a reviewer's invite link (README.md › Touchup). -->
    <script src="https://touchup.jona.no/t.js" data-project="jona-no" async></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
